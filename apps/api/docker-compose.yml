# Postgres, e-mail e storage locais. Rode nesta pasta: `docker compose up -d`. Os valores vêm do .env desta pasta.

# Nome do projeto no Docker (prefixo de containers e volumes). Troque ao criar um projeto a partir do
# template; sem isso, projetos diferentes na mesma máquina compartilhariam o volume do banco.
name: one

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no apps/api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no apps/api/.env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no apps/api/.env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Caixa de e-mail falsa para o dev: recebe tudo que a API manda por SMTP (porta 1025) e mostra
  # em http://localhost:8025. Nada sai para a internet.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # Storage compatível com S3 para o dev (RustFS; a MinIO parou de publicar imagens). Confere a
  # assinatura das URLs como o S3. Bucket e CORS: `pnpm --filter @repo/api storage:preparar`.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID no apps/api/.env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no apps/api/.env}
    ports:
      - '9000:9000'
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
