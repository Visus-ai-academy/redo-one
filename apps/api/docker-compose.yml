# Postgres local. Rode nesta pasta: `docker compose up -d`. Os valores vêm do .env desta pasta.

# Nome do projeto no Docker (prefixo de containers e volumes). Troque ao criar um projeto a partir do
# template; sem isso, projetos diferentes na mesma máquina compartilhariam o volume do banco.
name: monorepo-template

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no apps/api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no apps/api/.env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no apps/api/.env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
