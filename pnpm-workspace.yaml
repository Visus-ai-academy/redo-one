packages:
  - apps/*
  - packages/*

# Segurança da cadeia de suprimentos.
# Só instala versões publicadas há pelo menos 7 dias (em minutos). Com o valor explícito,
# o pnpm também valida o lockfile e falha em vez de aceitar versões novas em silêncio.
minimumReleaseAge: 10080
# Falha se uma versão nova de um pacote tiver menos garantias de procedência que as anteriores
# (ex.: deixou de ser publicada com provenance), sinal comum de conta comprometida.
trustPolicy: no-downgrade
# Scripts de instalação de dependências só rodam se liberados em `allowBuilds`; o resto falha o install.
strictDepBuilds: true
engineStrict: true
saveExact: true

# Um só @types/node no monorepo (o mesmo do apps/api). O graphile-worker pede o 22.x, que puxa o
# undici-types 6.21.0: publicado sem provenance depois de versões com, o trustPolicy barra (falso
# positivo, mudança no processo de publicação do Undici em 2024). Só tipos: não muda o runtime.
overrides:
  '@types/node': 26.6.6

allowBuilds:
  '@swc/core': false
  '@scarf/scarf': false
  esbuild: false
